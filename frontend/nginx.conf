server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Single Page Application (SPA) client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching for Vite bundle assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check endpoint for ALB / ECS / container monitoring
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Custom 404 error page fallback to index.html for SPA routing
    error_page 404 /index.html;
}
